name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# issues: write verlangt die README der release-please-action ohne Begründung;
# vermutlich (Annahme) für die Labels am Release-PR.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release-PR pflegen und veröffentlichen
    # Festgenagelt, Begründung siehe validate.yml.
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Sammelt gemergte Commits, pflegt einen Release-PR mit CHANGELOG und
      # angehobenen Versionsnummern. Wird dieser PR gemergt, entstehen Tag
      # und GitHub-Release automatisch.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Bewusst im selben Workflow: Was der Bot mit dem Standard-Token anlegt
  # (Tag, Release), startet keine anderen Workflows. Ein eigener Workflow auf
  # "release: published" liefe nie.
  blueprints-anhaengen:
    name: Blueprints ans Release hängen
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Versionen festgenagelt, Begründung siehe validate.yml.
      # enable-cache false: Dieser Job veröffentlicht und läuft selten; ein
      # Cache bringt hier kaum Zeit, wäre aber ein weiterer Weg, über den
      # fremde Inhalte in ein Release gelangen könnten (docs/ENTWURF.md 6.5).
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
          version: "0.13.8"

      # Sicherheitsnetz: Die Version in jedem Blueprint muss zum Tag passen.
      # release-please setzt sie selbst; das hier fängt einen Blueprint ab,
      # der in extra-files fehlt, bevor eine falsche Datei veröffentlicht wird.
      - name: Version gegen den Tag prüfen
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: uv run --locked python scripts/check_version.py "${TAG#v}"

      # Alle Blueprints per Muster statt fester Liste: Ein neuer Blueprint
      # braucht keine Änderung an diesem Workflow. Release-Anhänge haben keine
      # Ordner, deshalb müssen die Dateinamen eindeutig sein – das prüft
      # tests/test_struktur.py::test_blueprint_dateinamen_sind_eindeutig.
      # globstar: ** passt auf beliebig viele Ordnerebenen.
      # nullglob: Findet das Muster nichts, ist die Liste leer (Abbruch unten)
      # statt das Muster selbst als Dateinamen weiterzugeben.
      - name: Dateien anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s globstar nullglob
          dateien=(blueprints/**/*.yaml)
          if (( ${#dateien[@]} == 0 )); then
            echo "::error::Keine Blueprint-Dateien unter blueprints/ gefunden"
            exit 1
          fi
          printf 'hänge an: %s\n' "${dateien[@]}"
          gh release upload "$TAG" "${dateien[@]}" --clobber
