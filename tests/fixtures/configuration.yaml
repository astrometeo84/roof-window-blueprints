# Test-Konfiguration für die Prüfung in GitHub Actions (Job "Home Assistant
# lädt die Blueprints"). Home Assistant lädt damit die Blueprints und meldet
# Fehler im Aufbau.
#
# Template-Blueprints werden unten unter "template:" mit "use_blueprint:"
# eingebunden, je eine minimale und eine vollständig belegte Instanz (Skill
# neuer-blueprint). Achtung: Schemafehler einer Template-Instanz verwirft HA
# still, die CI bleibt grün. Ladefehler (falscher path, fehlende
# Pflichteingabe) sind nur Warnungen; weil die CI mit --fail-on-warnings
# prüft, werden sie laut Quelltext rot (Annahme, Gegenprobe in Etappe 3;
# Skill sonnengeometrie, Abschnitt 5). Die Tests in tests/test_struktur.py
# sind die Sicherung.
#
# Wegen --fail-on-warnings macht jede Warnung die CI rot. default_config bringt
# in der CI keine eigenen Warnungen mit (belegt: erster Lauf grün, PR #2).
# Ändert sich das mit einer neuen HA-Version, hier auf die nötigen
# Integrationen verkleinern – Warnungen nicht unterdrücken
# (docs/ENTWURF.md 6.1). default_config bringt auch die Sun-Integration
# (sun.sun) für "Fläche – Sonneneinfall" mit.
default_config:

automation: !include automations.yaml

# path ist relativ zu blueprints/template/. Die minimale Instanz hat nur die
# Pflichteingaben, die vollständige jede Eingabe plus name und unique_id
# (tests/test_struktur.py prüft beides).
template:
  # Fläche – Sonneneinfall, minimal
  - use_blueprint:
      path: dachfenster/flaeche_sonneneinfall.yaml
      input:
        azimut: 180
        neigung: 40
  # Fläche – Sonneneinfall, vollständig
  - use_blueprint:
      path: dachfenster/flaeche_sonneneinfall.yaml
      input:
        azimut: 135.5
        neigung: 22.5
    name: Sonneneinfall Beispielfläche
    unique_id: sonneneinfall_beispielflaeche
    unbekannt: 1
