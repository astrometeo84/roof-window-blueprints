# Test-Konfiguration für die Prüfung in GitHub Actions (Job "Home Assistant
# lädt die Blueprints"). Home Assistant lädt damit die Blueprints und meldet
# Fehler im Aufbau.
#
# Template-Blueprints werden unten unter "template:" mit "use_blueprint:"
# eingebunden, je eine minimale und eine vollständig belegte Instanz (Skill
# neuer-blueprint). Achtung: Fehler in einer Template-Instanz machen die CI
# nicht rot – Schemafehler verwirft HA still, Ladefehler (falscher path,
# fehlende Pflichteingabe) sind nur Warnungen (Skill sonnengeometrie,
# Abschnitt 5). Die Tests in tests/test_struktur.py sind die Sicherung.
default_config:

automation: !include automations.yaml

# Noch keine Blueprints (Etappe 2). Mit dem ersten Template-Blueprint kommt
# hier "template:" dazu, samt Template-Sensoren für die Entitäten, die die
# Instanzen referenzieren.
